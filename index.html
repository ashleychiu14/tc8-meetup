<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f0f0;color:#1a1a1a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border-radius:16px;max-width:440px;width:100%;padding:40px 32px;text-align:center;border:1px solid #e0e0e0;box-shadow:0 4px 20px rgba(0,0,0,0.06)}

.desc{font-size:15px;color:#555;line-height:1.8;margin-bottom:8px}
.desc strong{color:#003366}
.hint{font-size:13px;color:#999;line-height:1.7;margin-top:16px;margin-bottom:28px}
.btn{display:inline-block;width:100%;padding:15px 24px;background:#003366;color:#fff;font-size:16px;font-weight:600;border-radius:10px;text-decoration:none;transition:background 0.15s;letter-spacing:0.03em}
.btn:hover{background:#004488}
.url-box{margin-top:20px;padding:12px 14px;background:#f5f5f5;border-radius:8px;font-size:12px;color:#888;word-break:break-all;line-height:1.6}
.url-box a{color:#003366;text-decoration:none}
.foot{margin-top:24px;font-size:12px;color:#bbb}
</style>
