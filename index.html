<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TC8 讀書會出席登記</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f0f0;color:#1a1a1a;min-height:100vh}
  .top-bar{background:#003366;color:#fff;padding:14px 24px;display:flex;align-items:center;gap:12px}
  .top-bar h1{font-size:18px;font-weight:600;letter-spacing:0.02em}
  .tab-bar{display:flex;background:#fff;border-bottom:1px solid #ddd}
  .tab{padding:12px 22px;font-size:14px;cursor:pointer;border:none;background:none;color:#666;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.active{color:#003366;border-bottom-color:#003366;font-weight:600}
  .page{display:none}
  .page.active{display:block}
  .user-layout{display:flex;background:#f0f0f0}
  .logo-col{width:280px;flex-shrink:0;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;position:sticky;top:0;align-self:flex-start}
  .logo-col img{width:180px;height:180px;border-radius:50%;object-fit:cover}
  .divider{width:5px;background:#ff3300;flex-shrink:0}
  .main-col{flex:1;background:#fff}
  /* 出席表單區 */
  .form-section{padding:32px 36px;border-bottom:8px solid #f0f0f0}
  .section-header{font-size:15px;font-weight:700;color:#003366;margin-bottom:20px;padding-bottom:10px;border-bottom:1px solid #eee}
  /* 許願池區 */
  .wish-form-section{padding:28px 36px;background:#fff}
  .wish-header{font-size:15px;font-weight:700;color:#003366;margin-bottom:6px}
  .wish-desc{font-size:13px;color:#888;line-height:1.6;margin-bottom:18px}
  .field{margin-bottom:18px}
  .field label{display:block;font-size:13px;color:#555;margin-bottom:6px;font-weight:500}
  input[type=text],input[type=password],select,textarea{width:100%;padding:10px 12px;font-size:15px;border:1px solid #ccc;border-radius:6px;background:#fff;color:#1a1a1a;-webkit-appearance:none;appearance:none}
  input[type=text]:focus,select:focus,textarea:focus{outline:none;border-color:#003366}
  .date-display{width:100%;padding:10px 12px;font-size:15px;border:1px solid #e0e0e0;border-radius:6px;background:#f5f5f5;color:#555;cursor:not-allowed}
  .btn{display:inline-block;padding:10px 22px;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer;border:1px solid #ccc;background:#fff;color:#1a1a1a;transition:all 0.15s}
  .btn:hover{background:#f5f5f5}
  .btn.primary{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
  .btn.primary:hover{background:#333}
  .btn.secondary{background:#003366;color:#fff;border-color:#003366}
  .btn.secondary:hover{background:#004488}
  .btn.danger{color:#cc2200;border-color:#ffb3a0}
  .btn.danger:hover{background:#fff5f3}
  .btn:disabled{opacity:0.4;cursor:not-allowed}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .msg{font-size:13px;padding:10px 14px;border-radius:6px;margin-bottom:16px;line-height:1.5}
  .msg.success{background:#eaf3de;color:#2d6a1f;border-left:3px solid #4db86a}
  .msg.info{background:#e8f0fb;color:#1a4a8a;border-left:3px solid #4488cc}
  .msg.warn{background:#fff3e0;color:#8a4a00;border-left:3px solid #ff9900}
  .msg.error{background:#fdecea;color:#aa2200;border-left:3px solid #ff3300}
  .list-section{padding:0 36px 28px}
  .section-title{font-size:12px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:12px}
  .reg-table{width:100%;border-collapse:collapse;font-size:13px}
  .reg-table th{text-align:left;padding:7px 10px;color:#888;font-weight:600;border-bottom:2px solid #eee;font-size:12px;background:#f8f8f8}
  .reg-table td{padding:8px 10px;border-bottom:1px solid #f0f0f0;color:#1a1a1a}
  .reg-table tr:last-child td{border-bottom:none}
  .reg-table tr.mine td{background:#e8f0fb}
  .reg-table tr.cancelled td{color:#bbb;text-decoration:line-through}
  .refresh-btn{font-size:12px;color:#888;cursor:pointer;border:none;background:none;text-decoration:underline}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid #ddd;border-top-color:#003366;border-radius:50%;animation:spin 0.7s linear infinite;margin-right:6px;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
  .admin-wrap{max-width:720px;margin:0 auto;padding:24px 20px}
  .card{background:#fff;border-radius:10px;padding:20px;margin-bottom:14px;border:1px solid #e0e0e0}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .stat-box{background:#fff;border-radius:10px;padding:16px;border:1px solid #e0e0e0;text-align:center}
  .stat-box.blue{border-top:3px solid #003366}
  .stat-box.orange{border-top:3px solid #ff3300}
  .stat-num{font-size:28px;font-weight:700;line-height:1.1;color:#003366}
  .stat-num.orange{color:#ff3300}
  .stat-label{font-size:12px;color:#888;margin-top:4px}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px}
  .bar-name{min-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-bg{flex:1;height:5px;background:#eee;border-radius:3px;overflow:hidden}
  .bar-fill{height:100%;background:#003366;border-radius:3px}
  .bar-count{min-width:18px;text-align:right;color:#888;font-size:12px}
  .person-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f0f0f0;font-size:13px}
  .person-row:last-child{border-bottom:none}
  .badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
  .badge.tc8{background:#e8f0fb;color:#003366}
  .badge.guest{background:#fff3e0;color:#cc5500}
  .person-name{flex:1;font-weight:500}
  .person-detail{color:#888;font-size:12px;text-align:right;line-height:1.5}
  .cancelled .person-name{text-decoration:line-through;color:#bbb}
  .editable-list{display:flex;flex-direction:column;gap:8px}
  .editable-item{display:flex;gap:6px}
  .editable-item input{flex:1}
  .icon-btn{width:32px;height:38px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;font-size:16px;color:#999}
  .icon-btn:hover{color:#cc2200;border-color:#ffb3a0}
  .add-row{margin-top:8px}
  .add-row button{font-size:13px;color:#888;cursor:pointer;border:1px dashed #ddd;border-radius:6px;padding:7px 14px;background:none;width:100%}
  .add-row button:hover{background:#f8f8f8}
  .sep{height:1px;background:#eee;margin:20px 0}
  .empty{text-align:center;padding:16px;color:#bbb;font-size:13px}
  .hint{font-size:12px;color:#999;margin-top:4px}
  .wish-item{padding:12px;background:#f8f8f8;border-radius:8px;border:1px solid #eee;margin-bottom:10px}
  .wish-meta{font-size:12px;color:#aaa;margin-bottom:4px}
  .wish-content{font-size:14px;color:#1a1a1a;line-height:1.6}
  @media(max-width:600px){
    .user-layout{flex-direction:column}
    .logo-col{width:100%;padding:20px;flex-direction:row;gap:16px;justify-content:flex-start;position:static}
    .logo-col img{width:70px;height:70px}
    .divider{width:100%;height:4px}
    .form-section,.wish-form-section{padding:20px}
    .list-section{padding:0 20px 20px}
  }
</style>
</head>

</div>

    <div class="main-col">

      <!-- 出席登記 + 許願池 同一卡片 -->
      <div class="form-section">
        <div class="section-header">出席登記</div>
        <div id="user-msg"></div>
        <div class="field">
          <label>聚會日期</label>
          <div class="date-display" id="date-display">—</div>
        </div>
        <div class="field">
          <label>時間</label>
          <div class="date-display" id="time-display">—</div>
        </div>
        <div class="field">
          <label>地點</label>
          <div class="date-display" id="location-display" style="white-space:pre-wrap;line-height:1.7;height:auto;min-height:42px;word-break:break-all">—</div>
        </div>
        <div class="field">
          <label>姓名</label>
          <input type="text" id="u-name" placeholder="請填寫姓名">
          <div class="hint">建議填寫中文姓名，避免英文姓名相同造成混淆</div>
        </div>
        <div class="field">
          <label>身份</label>
          <select id="u-type">
            <option value="" disabled selected>請選擇身份</option>
            <option value="TC8">TC8 成員</option>
            <option value="來賓">來賓</option>
          </select>
        </div>
        <div class="field">
          <label>餐點</label>
          <select id="u-meal">
            <option value="" disabled selected>請選擇餐點</option>
          </select>
        </div>
        <div class="field">
          <label>飲品</label>
          <select id="u-drink">
            <option value="" disabled selected>請選擇飲品</option>
          </select>
        </div>

        <!-- 分隔線 -->
        <div style="height:1px;background:#eee;margin:24px 0"></div>

        <!-- 許願池 -->
        <div style="font-size:15px;font-weight:700;color:#003366;margin-bottom:6px">✦ 讀書會主題許願池</div>
        <div style="font-size:13px;color:#888;line-height:1.6;margin-bottom:18px">歡迎留下你想聽的主題、想問的問題或對讀書會的建議，管理者會統整後帶入討論。</div>
        <div id="wish-msg"></div>
        <div class="field">
          <label>許願姓名（選填）</label>
          <input type="text" id="w-name" placeholder="可匿名不填">
        </div>
        <div class="field">
          <label>你的許願內容</label>
          <textarea id="w-content" rows="4" placeholder="想聽的主題、想問的問題、對讀書會的建議..." style="resize:vertical;line-height:1.6"></textarea>
        </div>

        <!-- 兩個按鈕放同一行 -->
        <div class="btn-row">
          <button class="btn primary" id="submit-btn" onclick="submitUser()">確認出席</button>
          <button class="btn secondary" id="wish-btn" onclick="submitWish()">送出許願</button>
          <button class="btn" onclick="lookupName()">查詢 / 修改</button>
          <button class="btn danger" id="cancel-btn" style="display:none" onclick="cancelUser()">取消出席</button>
        </div>
      </div>

      <!-- 登記名單 -->
      <div id="reg-list-section" style="display:none;padding:24px 36px;border-top:8px solid #f0f0f0">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
          <div class="section-title" style="margin:0">目前登記名單</div>
          <button class="refresh-btn" onclick="loadRegList()">重新整理</button>
        </div>
        <div id="reg-list-loading" style="font-size:13px;color:#888"><span class="spinner"></span>載入中...</div>
        <div id="reg-list-body" style="display:none">
          <table class="reg-table">
            <thead><tr><th>姓名</th><th>餐點</th><th>飲品</th><th>狀態</th></tr></thead>
            <tbody id="reg-table-body"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- 管理者 -->
<div id="page-admin" class="page">
  <div class="admin-wrap">
    <div id="admin-locked">
      <div class="card">
        <div class="section-title">管理者登入</div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <input type="password" id="admin-pw-input" placeholder="輸入密碼" onkeydown="if(event.key==='Enter')checkPw()">
          <button class="btn primary" onclick="checkPw()">進入</button>
        </div>
        <div id="pw-msg" style="margin-top:10px"></div>
      </div>
    </div>

    <div id="admin-content" style="display:none">
      <div class="card">
        <div class="section-title">聚會設定</div>
        <div class="field" style="margin-top:10px">
          <label>聚會名稱</label>
          <input type="text" id="cfg-title" placeholder="例：5/25 TC8 讀書會">
        </div>
        <div class="field">
          <label>聚會日期</label>
          <input type="date" id="cfg-date">
        </div>
        <div class="field">
          <label>時間</label>
          <input type="text" id="cfg-time" placeholder="例：19:00 - 21:00（18:00 可入場）">
        </div>
        <div class="field">
          <label>地點</label>
          <textarea id="cfg-location" rows="3" style="width:100%;padding:10px 12px;font-size:14px;border:1px solid #ccc;border-radius:6px;resize:vertical;line-height:1.6;color:#1a1a1a;background:#fff"></textarea>
        </div>
        <div class="field">
          <label>餐點選項</label>
          <div class="editable-list" id="meal-list"></div>
          <div class="add-row"><button onclick="addOption('meal')">＋ 新增餐點</button></div>
        </div>
        <div class="field" style="margin-bottom:0">
          <label>飲品選項</label>
          <div class="editable-list" id="drink-list"></div>
          <div class="add-row"><button onclick="addOption('drink')">＋ 新增飲品</button></div>
        </div>
        <div style="margin-top:16px;display:flex;gap:8px;align-items:center">
          <button class="btn primary" onclick="saveSettings()">儲存設定</button>
          <span id="cfg-msg" style="font-size:13px;color:#2d6a1f"></span>
        </div>
      </div>

      <div class="sep"></div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div class="section-title" style="margin:0">即時統計</div>
        <button class="refresh-btn" onclick="loadAdmin()">重新整理</button>
      </div>
      <div id="admin-loading" style="font-size:13px;color:#888;padding:10px 0"><span class="spinner"></span>載入中...</div>
      <div id="admin-stats" style="display:none">
        <div class="stat-grid">
          <div class="stat-box blue"><div class="stat-num" id="s-total">0</div><div class="stat-label">確認出席</div></div>
          <div class="stat-box orange"><div class="stat-num orange" id="s-cancelled">0</div><div class="stat-label">已取消</div></div>
          <div class="stat-box"><div class="stat-num" id="s-tc8">0</div><div class="stat-label">TC8 成員</div></div>
          <div class="stat-box"><div class="stat-num" id="s-guest">0</div><div class="stat-label">來賓</div></div>
        </div>
        <div class="card">
          <div class="section-title">餐點統計</div>
          <div id="meal-stats"></div>
        </div>
        <div class="card">
          <div class="section-title">飲品統計</div>
          <div id="drink-stats"></div>
        </div>
        <div class="card">
          <div class="section-title">完整名單</div>
          <div id="person-list"></div>
        </div>

        <div class="sep"></div>

        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
          <div class="section-title" style="margin:0">主題許願池</div>
          <button class="refresh-btn" onclick="loadWishes()">重新整理</button>
        </div>
        <div id="wish-loading" style="font-size:13px;color:#888;padding:10px 0"><span class="spinner"></span>載入中...</div>
        <div id="wish-list" style="display:none"></div>
      </div>
    </div>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbwJ0JQhKIAT3GgLOOQB55CHKaSRPw7cAx4IrVmUHJ_tIjK_MVBT1urtWTUaBPAZ1BzS/exec';
const ADMIN_PW = 'tc8admin';
let config = { title:'TC8 讀書會', date:'', time:'', location:'', meals:[], drinks:[] };
let myName = '';

async function api(params){ const r=await fetch(API+'?'+new URLSearchParams(params)); return r.json(); }

async function init(){
  try{ const cfg=await api({action:'getConfig'}); if(cfg&&cfg.title) config={...config,...cfg}; }catch(e){}
  document.getElementById('top-title').textContent = config.title;
  document.getElementById('date-display').textContent = config.date || '（管理者尚未設定）';
  document.getElementById('time-display').textContent = config.time || '（管理者尚未設定）';
  document.getElementById('location-display').textContent = config.location || '（管理者尚未設定）';
  renderSelects();
}

function renderSelects(){
  document.getElementById('u-meal').innerHTML = '<option value="" disabled selected>請選擇餐點</option>' + config.meals.map(m=>`<option value="${m}">${m}</option>`).join('');
  document.getElementById('u-drink').innerHTML = '<option value="" disabled selected>請選擇飲品</option>' + config.drinks.map(d=>`<option value="${d}">${d}</option>`).join('');
}

async function lookupName(){
  const name = document.getElementById('u-name').value.trim();
  if(!name){ showMsg('user-msg','warn','請先輸入姓名'); return; }
  try{
    const rows = await api({action:'getAll', date:config.date});
    const found = rows.find(r=>r['姓名']===name);
    if(found){
      if(found['狀態']=== 'cancelled'){
        showMsg('user-msg','warn','找到你的紀錄（已取消）。可重新填寫確認出席。');
        document.getElementById('cancel-btn').style.display='none';
      }else{
        showMsg('user-msg','info',`找到紀錄：${found['餐點']} / ${found['飲品']}。可修改後重送，或取消出席。`);
        document.getElementById('u-type').value = found['身份']||'';
        document.getElementById('u-meal').value = found['餐點'];
        document.getElementById('u-drink').value = found['飲品'];
        document.getElementById('cancel-btn').style.display='block';
      }
    }else{
      showMsg('user-msg','info','查無紀錄，請直接填寫送出。');
      document.getElementById('cancel-btn').style.display='none';
    }
  }catch(e){ showMsg('user-msg','error','查詢失敗'); }
}

async function submitUser(){
  const name = document.getElementById('u-name').value.trim();
  const type = document.getElementById('u-type').value;
  const meal = document.getElementById('u-meal').value;
  const drink = document.getElementById('u-drink').value;
  if(!name){ showMsg('user-msg','warn','請先輸入姓名'); return; }
  if(!type){ showMsg('user-msg','warn','請選擇身份'); return; }
  if(!meal){ showMsg('user-msg','warn','請選擇餐點'); return; }
  if(!drink){ showMsg('user-msg','warn','請選擇飲品'); return; }
  if(!config.date){ showMsg('user-msg','error','管理者尚未設定聚會日期，請稍後再試'); return; }
  const btn = document.getElementById('submit-btn');
  btn.disabled=true; btn.textContent='送出中...';
  try{
    await api({action:'upsert', name, type, meal, drink, status:'confirmed', date:config.date});
    myName = name;
    showMsg('user-msg','success',`登記成功！${name}，餐點：${meal}，飲品：${drink}`);
    document.getElementById('cancel-btn').style.display='block';
    document.getElementById('reg-list-section').style.display='block';
    loadRegList();
  }catch(e){ showMsg('user-msg','error','送出失敗，請稍後再試'); }
  btn.disabled=false; btn.textContent='確認出席';
}

async function cancelUser(){
  const name = document.getElementById('u-name').value.trim();
  if(!name||!confirm(`確定要取消 ${name} 的出席嗎？`)) return;
  try{
    await api({action:'upsert', name, type:document.getElementById('u-type').value||'TC8', meal:'取消', drink:'取消', status:'cancelled', date:config.date});
    showMsg('user-msg','warn',`${name} 的出席已取消。`);
    document.getElementById('cancel-btn').style.display='none';
    loadRegList();
  }catch(e){ showMsg('user-msg','error','操作失敗'); }
}

async function loadRegList(){
  document.getElementById('reg-list-loading').style.display='block';
  document.getElementById('reg-list-body').style.display='none';
  try{
    const rows = await api({action:'getAll', date:config.date});
    document.getElementById('reg-table-body').innerHTML = rows.length ? rows.map(r=>{
      const isMine = r['姓名']===myName;
      const cancelled = r['狀態']=== 'cancelled';
      return `<tr class="${isMine?'mine':''} ${cancelled?'cancelled':''}"}>
        <td>${r['姓名']}${isMine?' ✓':''}</td>
        <td>${cancelled?'—':r['餐點']}</td>
        <td>${cancelled?'—':r['飲品']}</td>
        <td style="color:${cancelled?'#bbb':'#2d6a1f'}">${cancelled?'已取消':'已登記'}</td>
      </tr>`;
    }).join('') : '<tr><td colspan="4" style="text-align:center;color:#bbb;padding:12px">尚無資料</td></tr>';
    document.getElementById('reg-list-loading').style.display='none';
    document.getElementById('reg-list-body').style.display='block';
  }catch(e){}
}

async function submitWish(){
  const content = document.getElementById('w-content').value.trim();
  if(!content){ showMsg('wish-msg','warn','請填寫許願內容'); return; }
  const btn = document.getElementById('wish-btn');
  btn.disabled=true; btn.textContent='送出中...';
  try{
    await api({action:'addWish', name:document.getElementById('w-name').value.trim(), content});
    document.getElementById('w-content').value='';
    document.getElementById('w-name').value='';
    showMsg('wish-msg','success','許願成功！感謝你的回饋 ✦');
  }catch(e){ showMsg('wish-msg','error','送出失敗，請稍後再試'); }
  btn.disabled=false; btn.textContent='送出許願';
}

function checkPw(){
  if(document.getElementById('admin-pw-input').value===ADMIN_PW){
    document.getElementById('admin-locked').style.display='none';
    document.getElementById('admin-content').style.display='block';
    renderAdminSettings(); loadAdmin();
  }else{
    document.getElementById('pw-msg').innerHTML='<div class="msg error">密碼錯誤</div>';
  }
}

function renderAdminSettings(){
  document.getElementById('cfg-title').value = config.title;
  document.getElementById('cfg-date').value = config.date||'';
  document.getElementById('cfg-time').value = config.time||'';
  document.getElementById('cfg-location').value = config.location||'';
  document.getElementById('meal-list').innerHTML = config.meals.map((v,i)=>`
    <div class="editable-item"><input type="text" value="${v}" oninput="config.meals[${i}]=this.value">
    <button class="icon-btn" onclick="removeOption('meals',${i})">×</button></div>`).join('');
  document.getElementById('drink-list').innerHTML = config.drinks.map((v,i)=>`
    <div class="editable-item"><input type="text" value="${v}" oninput="config.drinks[${i}]=this.value">
    <button class="icon-btn" onclick="removeOption('drinks',${i})">×</button></div>`).join('');
}

function addOption(t){ if(t==='meal') config.meals.push(''); else config.drinks.push(''); renderAdminSettings(); }
function removeOption(k,i){ config[k].splice(i,1); renderAdminSettings(); }

async function saveSettings(){
  config.title = document.getElementById('cfg-title').value.trim()||'TC8 讀書會';
  config.date = document.getElementById('cfg-date').value;
  config.time = document.getElementById('cfg-time').value.trim();
  config.location = document.getElementById('cfg-location').value.trim();
  config.meals = config.meals.filter(m=>m.trim());
  config.drinks = config.drinks.filter(d=>d.trim());
  try{
    await api({action:'saveConfig', config:JSON.stringify(config)});
    document.getElementById('top-title').textContent = config.title;
    document.getElementById('date-display').textContent = config.date||'（管理者尚未設定）';
    document.getElementById('time-display').textContent = config.time||'（管理者尚未設定）';
    document.getElementById('location-display').textContent = config.location||'（管理者尚未設定）';
    renderSelects(); renderAdminSettings();
    const m = document.getElementById('cfg-msg');
    m.textContent='已儲存 ✓'; setTimeout(()=>m.textContent='',2000);
  }catch(e){ document.getElementById('cfg-msg').textContent='儲存失敗'; }
}

async function loadAdmin(){
  document.getElementById('admin-loading').style.display='block';
  document.getElementById('admin-stats').style.display='none';
  try{
    const rows = await api({action:'getAll', date:config.date});
    const confirmed = rows.filter(r=>r['狀態']=== 'confirmed');
    const cancelled = rows.filter(r=>r['狀態']=== 'cancelled');
    document.getElementById('s-total').textContent = confirmed.length;
    document.getElementById('s-cancelled').textContent = cancelled.length;
    document.getElementById('s-tc8').textContent = confirmed.filter(r=>r['身份']=== 'TC8').length;
    document.getElementById('s-guest').textContent = confirmed.filter(r=>r['身份']=== '來賓').length;
    document.getElementById('meal-stats').innerHTML = barHTML(confirmed,'餐點');
    document.getElementById('drink-stats').innerHTML = barHTML(confirmed,'飲品');
    document.getElementById('person-list').innerHTML = rows.length ? rows.map(r=>`
      <div class="person-row ${r['狀態']=== 'cancelled'?'cancelled':''}"}>
        <span class="badge ${r['身份']=== 'TC8'?'tc8':'guest'}">${r['身份']||'—'}</span>
        <span class="person-name">${r['姓名']}</span>
        <span class="person-detail">${r['狀態']=== 'cancelled'?'已取消':r['餐點']+'<br>'+r['飲品']}</span>
      </div>`).join('') : '<div class="empty">尚無資料</div>';
    document.getElementById('admin-loading').style.display='none';
    document.getElementById('admin-stats').style.display='block';
    loadWishes();
  }catch(e){ document.getElementById('admin-loading').innerHTML='<div class="msg error">載入失敗</div>'; }
}

async function loadWishes(){
  document.getElementById('wish-loading').style.display='block';
  document.getElementById('wish-list').style.display='none';
  try{
    const wishes = await api({action:'getWishes'});
    const el = document.getElementById('wish-list');
    el.innerHTML = wishes.length ? wishes.slice().reverse().map(w=>`
      <div class="wish-item">
        <div class="wish-meta">${w['提交時間']} ／ ${w['姓名']||'匿名'}</div>
        <div class="wish-content">${String(w['內容']).replace(/\n/g,'<br>')}</div>
      </div>`).join('') : '<div class="empty">尚無許願</div>';
    document.getElementById('wish-loading').style.display='none';
    el.style.display='block';
  }catch(e){ document.getElementById('wish-loading').innerHTML='<div style="font-size:13px;color:#bbb">載入失敗</div>'; }
}

function barHTML(rows,key){
  if(!rows.length) return '<div class="empty">尚無資料</div>';
  const counts={};
  rows.forEach(r=>{ const v=r[key]; if(v) counts[v]=(counts[v]||0)+1; });
  const max=Math.max(...Object.values(counts),1);
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`
    <div class="bar-row"><div class="bar-name">${k}</div>
    <div class="bar-bg"><div class="bar-fill" style="width:${Math.round(n/max*100)}%"></div></div>
    <div class="bar-count">${n}</div></div>`).join('');
}

function showMsg(id,type,text){ document.getElementById(id).innerHTML=`<div class="msg ${type}">${text}</div>`; }

function switchTab(t){
  ['user','admin'].forEach(tab=>{ document.getElementById(`page-${tab}`).classList.toggle('active',tab===t); });
  document.querySelectorAll('.tab').forEach((el,i)=>{ el.classList.toggle('active',['user','admin'][i]===t); });
}

init();
</script>
</body>
</html>
